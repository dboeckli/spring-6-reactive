apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "application-template.fullname" . }}-test"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "application-template.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-actuator-health
      image: {{.Values.busyboxImage.repository }}:{{.Values.busyboxImage.tag }}
      imagePullPolicy: {{.Values.busyboxImage.pullPolicy }}
      command: [ '/bin/sh', '-c' ]
      args:
        - |
          ERROR_OCCURED=0

          check_health() {
            ENDPOINT="$1"
            LABEL="$2"
            rc=1
            echo "### Test: $LABEL"
            for attempt in 1 2 3 4 5; do
              wget -O- -q "$ENDPOINT"
              rc=$?
              if [ $rc -eq 0 ]; then
                break
              fi
              echo "Attempt $attempt of 5 failed (exit code: $rc) - waiting 2s before retry"
              sleep 2
            done
            echo "Exit code: $rc"
            if [ $rc -ne 0 ]; then
              ERROR_OCCURED=1
            fi
          }

          check_health "{{ include "application-template.fullname" . }}:{{ .Values.service.port }}/actuator/health" "Checking health endpoint using service short name: {{ include "application-template.fullname" . }}"
          check_health "{{ include "application-template.serviceFQDN" . }}:{{ .Values.service.port }}/actuator/health" "Checking health endpoint using fully qualified domain name (FQDN): {{ include "application-template.serviceFQDN" . }}"

          if [ $ERROR_OCCURED -ne 0 ]; then
            # Print DNS configuration
            echo "### DNS Configuration:"
            cat /etc/resolv.conf

            # Test DNS resolution
            echo "### Testing DNS resolution:"
            AP_FQDN="{{ include "application-template.serviceFQDN" . }}"
            echo "nslookup AP_FQDN: $AP_FQDN"
            nslookup $AP_FQDN
          fi

          exit $ERROR_OCCURED

  restartPolicy: Never
